<title>Hello Quantum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : un seul écran. À gauche le code Python, à droite le circuit qui se redessine à chaque frappe, sur un ciel étoilé discret. */
:root{
  color-scheme: dark;
  --void:#04060d; --solid:#0a0f1f; --panel:rgba(10,14,28,.68);
  --neb-a:rgba(92,86,214,.20); --neb-b:rgba(28,128,170,.15);
  --edge:rgba(150,168,255,.13); --edge-strong:rgba(150,168,255,.30);
  --wire:rgba(170,186,255,.34); --row:rgba(134,214,255,.07); --row-strong:rgba(134,214,255,.13);
  --text:#e3e8fb; --dim:#8a94b6; --faint:#4d5777;
  --ice:#86d6ff; --rose:#ff9db5; --iris:#b9a8ff; --mint:#7fe6c6; --silver:#c5cde8; --gold:#f2d48a;
  --err:#ff8e9a; --ok:#7fe6c6;
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 680px at 82% -12%, var(--neb-a), transparent 62%),
    radial-gradient(900px 620px at 4% 108%, var(--neb-b), transparent 60%),
    var(--void);
  background-attachment:fixed;
  color:var(--text); font-family:var(--f-display); font-size:14px; overflow:hidden;
}
#sky{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
.app{
  position:relative; z-index:1; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); gap:14px;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
header{display:flex; align-items:center; gap:12px; padding-inline:4px; min-width:0}
.mark{width:26px; height:26px; flex:none}
h1{margin:0; font-size:16px; font-weight:600; letter-spacing:.01em; white-space:nowrap}
.sub{color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.sub::before{content:""; display:inline-block; width:1px; height:12px; background:var(--edge-strong); margin-right:12px; vertical-align:-1px}
.pill{margin-left:auto; display:flex; align-items:center; gap:8px; font-family:var(--f-mono); font-size:11px; color:var(--dim);
  padding:5px 10px; border:1px solid var(--edge); border-radius:999px; white-space:nowrap}
.pill i{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); transition:background .3s, box-shadow .3s}
.pill.bad i{background:var(--err); box-shadow:0 0 8px var(--err)}

main{display:grid; grid-template-columns:minmax(320px, 40%) minmax(0,1fr); gap:14px; min-height:0}
.panel{
  min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--panel); border:1px solid var(--edge); border-radius:14px;
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  transition:border-color .25s;
}
.panel:focus-within{border-color:var(--edge-strong)}
.bar{display:flex; align-items:center; gap:10px; height:40px; padding:0 14px; flex:none;
  border-bottom:1px solid var(--edge); font-family:var(--f-mono); font-size:11.5px; color:var(--dim)}
.bar b{font-weight:500; color:var(--text)}
.bar .hint{margin-left:auto; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---- éditeur ---- */
.code{position:relative; flex:1; min-height:0; display:grid; grid-template-columns:auto minmax(0,1fr);
  font-family:var(--f-mono); font-size:13.5px; line-height:22px; font-variant-ligatures:none}
.gutter{overflow:hidden; padding:14px 0; text-align:right; color:var(--faint); user-select:none; min-width:46px; font-size:12px}
.gutter span{display:block; height:22px; padding:0 12px 0 12px}
.gutter span.bad{color:var(--err)}
.gutter span.on{color:var(--ice)}
.edit{position:relative; overflow:hidden; min-width:0}
.layer{position:absolute; top:0; left:0; min-width:100%; padding:14px 18px 14px 4px; pointer-events:none; will-change:transform}
.hl{margin:0; font:inherit; white-space:pre; color:var(--text); tab-size:4}
.lh{position:absolute; left:-4000px; right:-4000px; height:22px; background:var(--row); opacity:0; transition:opacity .18s}
.lh.show{opacity:1}
.lh.err{background:rgba(255,142,154,.10)}
#src{position:absolute; inset:0; width:100%; height:100%; margin:0; padding:14px 18px 14px 4px; border:0; outline:0; resize:none;
  background:transparent; color:transparent; -webkit-text-fill-color:transparent; caret-color:var(--ice);
  font:inherit; white-space:pre; overflow:auto; tab-size:4; overflow-wrap:normal; word-break:normal; letter-spacing:0}
#src::selection{background:rgba(134,214,255,.22)}
.tk-c{color:var(--faint); font-style:italic} .tk-s{color:var(--mint)} .tk-n{color:var(--gold)}
.tk-k{color:var(--iris)} .tk-d{color:var(--dim)} .tk-q{color:var(--dim)} .tk-g{color:var(--ice)} .tk-f{color:var(--silver)}
.foot{flex:none; min-height:34px; display:flex; align-items:center; gap:8px; padding:7px 14px; border-top:1px solid var(--edge);
  font-family:var(--f-mono); font-size:11.5px; color:var(--faint)}
.foot.bad{color:var(--err)}
.foot span{min-width:0; overflow-wrap:anywhere}

/* ---- scène ---- */
.stage .bar{gap:6px}
.chips{display:flex; gap:6px; overflow-x:auto; min-width:0; scrollbar-width:none; padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; font:inherit; color:var(--dim); background:transparent; border:1px solid transparent; border-radius:8px; padding:4px 9px; cursor:pointer; transition:color .2s, border-color .2s, background .2s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text); border-color:var(--edge-strong); background:rgba(150,168,255,.07)}
.chip:focus-visible, .gate:focus-visible{outline:1.5px solid var(--ice); outline-offset:2px}
.view{flex:1; min-height:0; overflow:auto; display:flex; padding:18px; transition:opacity .3s}
.view.stale{opacity:.38}
.view svg{margin:auto; flex:none; display:block; overflow:visible}
.empty{margin:auto; color:var(--faint); font-family:var(--f-mono); font-size:12.5px; text-align:center; line-height:1.7}
.stats{justify-content:center; gap:0; flex-wrap:wrap; height:auto; min-height:40px; padding-block:6px}
.stats b{font-weight:500; color:var(--silver)}
.stats span + span::before{content:"·"; margin:0 12px; color:var(--faint)}
#src, .view{scrollbar-width:thin; scrollbar-color:var(--edge-strong) transparent}

/* ---- circuit SVG ---- */
.w-q{stroke:var(--wire); stroke-width:1.2}
.w-c{stroke:var(--wire); stroke-width:1; opacity:.7}
.w-name{font:500 11px var(--f-mono); fill:var(--faint)}
.w-ket{font:500 14px var(--f-display); fill:var(--silver)}
.wire.enter .w-q{stroke-dasharray:1; stroke-dashoffset:1; animation:drawWire .7s cubic-bezier(.2,.7,.2,1) forwards}
.wire.enter text{animation:fadeIn .5s both}
.comet{opacity:0; animation:fly var(--t) linear infinite; animation-delay:var(--dl)}
.grp rect{fill:rgba(150,168,255,.035); stroke:var(--edge); stroke-dasharray:3 4}
.grp text{font:500 9.5px var(--f-mono); fill:var(--dim); letter-spacing:.06em}
.gate{--c:var(--silver); cursor:default; outline:none}
.fam-h{--c:var(--ice)} .fam-pauli{--c:var(--rose)} .fam-rot{--c:var(--iris)} .fam-phase{--c:var(--mint)} .fam-meas{--c:var(--gold)}
.gate .b{fill:var(--solid); stroke:var(--c); stroke-width:1.15; stroke-opacity:.62; transition:stroke-opacity .2s, filter .2s}
.gate .tint{fill:var(--c); opacity:.055; transition:opacity .2s}
.gate .ln{stroke:var(--c); stroke-width:1.2; stroke-opacity:.75; fill:none; stroke-linecap:round}
.gate .dot{fill:var(--c)}
.gate .odot{fill:var(--solid); stroke:var(--c); stroke-width:1.3}
.gate .lbl{font:600 15px var(--f-display); fill:var(--c); text-anchor:middle; dominant-baseline:central}
.gate .prm{font:500 10.5px var(--f-mono); fill:var(--text); opacity:.8; text-anchor:middle; dominant-baseline:central}
.gate .cap{font:500 9px var(--f-mono); fill:var(--c); opacity:.9; text-anchor:middle; dominant-baseline:central; letter-spacing:.02em}
.gate .hit{fill:transparent}
.gate.cond .b{stroke-dasharray:4 3}
.gate.bar .ln{stroke-dasharray:2 5; stroke-opacity:.5}
.gate:hover .b, .gate:focus-visible .b, .gate.lit .b{stroke-opacity:1; filter:drop-shadow(0 0 7px var(--c))}
.gate:hover .tint, .gate.lit .tint{opacity:.12}
.gate.lit .ln, .gate:hover .ln{stroke-opacity:1}
.gate.enter{animation:gateIn .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:var(--d,0ms); transform-box:fill-box; transform-origin:center}
@keyframes gateIn{from{opacity:0; transform:translateY(7px) scale(.9)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes drawWire{to{stroke-dashoffset:0}}
@keyframes fly{0%{transform:translateX(var(--a)); opacity:0} 5%{opacity:.95} 50%{opacity:.95} 56%{transform:translateX(var(--b)); opacity:0} 100%{transform:translateX(var(--b)); opacity:0}}

/* ---- infobulle ---- */
#tip{position:fixed; z-index:30; left:0; top:0; max-width:280px; pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity .16s, transform .16s; background:rgba(8,11,23,.94); border:1px solid var(--edge-strong); border-radius:11px;
  padding:11px 13px; box-shadow:0 14px 40px rgba(0,0,0,.55)}
#tip.show{opacity:1; transform:none}
#tip h2{margin:0 0 3px; font-size:13.5px; font-weight:600}
#tip code{display:block; font-family:var(--f-mono); font-size:11px; color:var(--dim); margin-bottom:7px; overflow-wrap:anywhere}
#tip p{margin:0; font-size:12.5px; line-height:1.5; color:var(--silver)}
.mx{display:inline-flex; align-items:center; gap:8px; margin-top:9px; font-family:var(--f-mono); font-size:11.5px; color:var(--text)}
.mx .g{display:grid; gap:3px 12px; padding:5px 9px; border-left:1.5px solid var(--dim); border-right:1.5px solid var(--dim); border-radius:5px; text-align:center}
.mx .pre{color:var(--dim)}

@media (max-width: 880px){
  body{overflow:auto}
  .app{height:auto; min-height:100%; grid-template-rows:auto auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1; height:min(52vh, 420px); min-height:300px}
  .editor{height:440px}
  .sub{display:none}
}
@media (prefers-reduced-motion: reduce){
  .comet{display:none}
  .gate.enter, .wire.enter .w-q, .wire.enter text{animation:none; stroke-dashoffset:0}
  *{transition:none !important}
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
      <ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="var(--ice)" stroke-width="1.1" opacity=".85" transform="rotate(-28 13 13)"/>
      <ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="var(--iris)" stroke-width="1.1" opacity=".7" transform="rotate(38 13 13)"/>
      <circle cx="13" cy="13" r="2.3" fill="var(--text)"/>
    </svg>
    <h1>Hello Quantum</h1>
    <span class="sub">Workshop 1 · du code PennyLane au circuit</span>
    <span class="pill" id="pill"><i></i><span id="pillTxt">PennyLane · en direct</span></span>
  </header>
  <main>
    <section class="panel editor" aria-label="Code Python">
      <div class="bar"><b>circuit.py</b><span class="hint">le schéma suit ce que tu écris</span></div>
      <div class="code">
        <div class="gutter" aria-hidden="true"><div id="gut"></div></div>
        <div class="edit">
          <div class="layer" id="layer"><div class="lh" id="lhHover"></div><div class="lh err" id="lhErr"></div><pre class="hl" id="hl" aria-hidden="true"></pre></div>
          <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" aria-label="Code Python du circuit"></textarea>
        </div>
      </div>
      <div class="foot" id="foot"><span id="footTxt">Python · PennyLane</span></div>
    </section>
    <section class="panel stage" aria-label="Circuit quantique">
      <div class="bar"><div class="chips" id="chips"></div></div>
      <div class="view" id="view"></div>
      <div class="bar stats" id="stats" style="border-bottom:0; border-top:1px solid var(--edge)"></div>
    </section>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
/*ENGINE-START*/
const QEngine = (() => {
'use strict';
class PyError extends Error { constructor(msg, line){ super(msg); this.line = line || 0; } }

/* ============ analyse lexicale ============ */
const KW = new Set(['def','return','for','in','if','elif','else','while','import','from','as','pass','and','or','not','True','False','None','lambda','with','break','continue','is','global','nonlocal','del','assert','try','except','finally','raise','class']);
const OPS = ['**=','//=','>>=','<<=','...','**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','@=','->',':=','<<','>>',
  '+','-','*','/','%','@','(',')','[',']','{','}',',',':','.','=','<','>','~','&','|','^'];
function tokenize(src){
  const s = src, n = s.length, toks = [], indents = [0], open = [];
  let i = 0, line = 1, bol = true;
  const push = (t, v) => toks.push({t, v, line});
  const reNum = /(?:0[xX][0-9a-fA-F]+|(?:\d[\d_]*(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)[jJ]?/y;
  const reName = /[A-Za-z_\u0080-￿][\w\u0080-￿]*/y;
  const reStr = /([rRbBfFuU]{0,2})('''|"""|'|")/y;
  while (i < n){
    if (bol && !open.length){
      let col = 0, j = i;
      while (j < n && s[j] === ' '){ col++; j++; }
      if (j >= n){ i = j; break; }
      if (s[j] === '\n'){ i = j + 1; line++; continue; }
      if (s[j] === '#'){ while (j < n && s[j] !== '\n') j++; i = j; continue; }
      if (col > indents[indents.length-1]){ indents.push(col); push('INDENT'); }
      else { while (col < indents[indents.length-1]){ indents.pop(); push('DEDENT'); }
        if (col !== indents[indents.length-1]) throw new PyError("Indentation incohérente avec les lignes précédentes", line); }
      i = j; bol = false;
    }
    const c = s[i];
    if (c === '\n'){ if (!open.length){ push('NEWLINE'); bol = true; } i++; line++; continue; }
    if (c === ' '){ i++; continue; }
    if (c === '#'){ while (i < n && s[i] !== '\n') i++; continue; }
    if (c === '\\' && s[i+1] === '\n'){ i += 2; line++; continue; }
    if (c === ';'){ push('NEWLINE'); i++; continue; }
    reStr.lastIndex = i; let m = reStr.exec(s);
    if (m){
      const q = m[2], startLine = line; let j = i + m[0].length, out = '';
      for (;;){
        if (j >= n || (q.length === 1 && s[j] === '\n')) throw new PyError('Chaîne de caractères non fermée', startLine);
        if (s[j] === '\\'){ out += s[j+1] === 'n' ? '\n' : (s[j+1] || ''); if (s[j+1] === '\n') line++; j += 2; continue; }
        if (s.startsWith(q, j)){ j += q.length; break; }
        if (s[j] === '\n') line++;
        out += s[j++];
      }
      toks.push({t:'str', v:out, line:startLine}); i = j; continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i+1] || ''))){
      reNum.lastIndex = i; m = reNum.exec(s);
      const raw = m[0].replace(/_/g,'').replace(/[jJ]$/,'');
      push('num', Number(raw)); i += m[0].length; continue;
    }
    reName.lastIndex = i; m = reName.exec(s);
    if (m){ push(KW.has(m[0]) ? 'kw' : 'name', m[0]); i += m[0].length; continue; }
    let op = null; for (const o of OPS) if (s.startsWith(o, i)){ op = o; break; }
    if (!op) throw new PyError(`Caractère inattendu « ${c} »`, line);
    if (op === '(' || op === '[' || op === '{') open.push({op, line});
    else if (op === ')' || op === ']' || op === '}'){
      const o = open.pop(), want = {')':'(', ']':'[', '}':'{'}[op];
      if (!o || o.op !== want) throw new PyError(`« ${op} » en trop`, line);
    }
    push('op', op); i += op.length;
  }
  if (open.length){ const o = open[open.length-1]; throw new PyError(`« ${o.op} » ouvert ici n'est jamais refermé`, o.line); }
  if (toks.length && toks[toks.length-1].t !== 'NEWLINE') push('NEWLINE');
  while (indents.length > 1){ indents.pop(); push('DEDENT'); }
  push('EOF');
  return toks;
}

/* ============ analyse syntaxique ============ */
function parse(src){
  const T = tokenize(src); let p = 0;
  const isOp = v => T[p].t === 'op' && T[p].v === v;
  const isKw = v => T[p].t === 'kw' && T[p].v === v;
  const eatOp = v => isOp(v) ? (p++, true) : false;
  const eatKw = v => isKw(v) ? (p++, true) : false;
  const say = k => k.t === 'NEWLINE' ? 'la fin de la ligne' : k.t === 'EOF' ? 'la fin du code' : k.t === 'INDENT' ? 'une indentation' : k.t === 'DEDENT' ? 'la fin du bloc' : `« ${k.v} »`;
  const fail = (msg, k = T[p]) => { throw new PyError(msg, k.line); };
  const needOp = v => { if (!eatOp(v)) fail(`« ${v} » attendu avant ${say(T[p])}`); };
  const needKw = v => { if (!eatKw(v)) fail(`« ${v} » attendu avant ${say(T[p])}`); };
  const name = () => { if (T[p].t !== 'name') fail(`Nom attendu avant ${say(T[p])}`); return T[p++].v; };
  const endLine = () => { if (T[p].t === 'NEWLINE') p++; else if (T[p].t !== 'EOF' && T[p].t !== 'DEDENT') fail(`Syntaxe invalide près de ${say(T[p])}`); };
  const endsExpr = () => T[p].t === 'NEWLINE' || T[p].t === 'EOF' || (T[p].t === 'op' && [')',']','}','=',':'].includes(T[p].v)) || isKw('in');

  function file(){ const body = []; while (T[p].t !== 'EOF'){ if (T[p].t === 'NEWLINE'){ p++; continue; } body.push(stmt()); } return body; }
  function block(){
    needOp(':');
    if (T[p].t === 'NEWLINE'){
      p++;
      if (T[p].t !== 'INDENT') fail('Il manque un bloc indenté après « : »');
      p++; const body = [];
      while (T[p].t !== 'DEDENT' && T[p].t !== 'EOF'){ if (T[p].t === 'NEWLINE'){ p++; continue; } body.push(stmt()); }
      if (T[p].t === 'DEDENT') p++;
      return body;
    }
    const s = simple(); endLine(); return [s];
  }
  function params(close){
    const ps = [];
    while (!isOp(close)){
      let star = 0;
      if (eatOp('**')) star = 2; else if (eatOp('*')) star = 1; else if (eatOp('/')){ eatOp(','); continue; }
      if (star === 1 && (isOp(',') || isOp(close))){ eatOp(','); continue; }
      const prm = {name: name(), star, def: null};
      if (close === ')' && eatOp(':')) expr();
      if (eatOp('=')) prm.def = expr();
      ps.push(prm);
      if (!eatOp(',')) break;
    }
    return ps;
  }
  function stmt(){
    const k = T[p], line = k.line;
    if (k.t === 'INDENT') fail('Indentation inattendue');
    if (isOp('@')){
      const decs = [];
      while (eatOp('@')){ decs.push(expr()); endLine(); }
      if (!isKw('def') && !isKw('class')) fail('Un décorateur doit être suivi de « def »');
      const d = stmt(); d.decs = decs; return d;
    }
    if (k.t === 'kw') switch (k.v){
      case 'def': { p++; const nm = name(); needOp('('); const ps = params(')'); needOp(')'); if (eatOp('->')) expr(); return {t:'Def', name:nm, params:ps, body:block(), decs:[], line}; }
      case 'class': { p++; const nm = name(); if (eatOp('(')){ while (!isOp(')')){ arg(); if (!eatOp(',')) break; } needOp(')'); } block(); return {t:'Class', name:nm, decs:[], line}; }
      case 'if': { p++; const tests = [{c: expr(), body: block()}]; let orelse = null;
        for (;;){ if (eatKw('elif')) tests.push({c: expr(), body: block()}); else if (eatKw('else')){ orelse = block(); break; } else break; }
        return {t:'If', tests, orelse, line}; }
      case 'for': { p++; const target = targets(); needKw('in'); const it = exprList(); const body = block(); if (eatKw('else')) block(); return {t:'For', target, iter:it, body, line}; }
      case 'while': { p++; const c = expr(); const body = block(); if (eatKw('else')) block(); return {t:'While', c, body, line}; }
      case 'with': { p++; const items = []; do { const e = expr(); let as = null; if (eatKw('as')) as = targets(); items.push({e, as}); } while (eatOp(',')); return {t:'With', items, body: block(), line}; }
      case 'try': { p++; const body = block(); const handlers = []; let fin = null;
        while (eatKw('except')){ if (!isOp(':')){ expr(); if (eatKw('as')) name(); } handlers.push(block()); }
        if (eatKw('else')) block(); if (eatKw('finally')) fin = block();
        return {t:'Try', body, handlers, fin, line}; }
      case 'return': { p++; const e = (T[p].t === 'NEWLINE' || T[p].t === 'EOF' || T[p].t === 'DEDENT') ? null : exprList(); endLine(); return {t:'Return', e, line}; }

    } else insertText(' '.repeat(4 - ((a - ls) % 4)));
  } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    const line = v.slice(ls, a), ind = /^ */.exec(line)[0];
    insertText('\n' + ind + (/:\s*(#.*)?$/.test(line) ? '    ' : ''));
  } else if (e.key === 'Backspace' && a === b){
    const before = v.slice(ls, a);
    if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = ((before.length - 1) % 4) + 1; ta.setSelectionRange(a - k, a); let ok = false; try { ok = document.execCommand('delete'); } catch (x){} if (!ok){ ta.setRangeText('', a - k, a, 'end'); ta.dispatchEvent(new Event('input')); } }
  }
});
function caretMoved(){
  const line = document.activeElement === ta ? ta.value.slice(0, ta.selectionStart).split('\n').length : 0;
  if (line !== caretLine){ caretLine = line; markGutter(); litGates(); }
}
function litGates(){ $('view').querySelectorAll('.gate').forEach(g => g.classList.toggle('lit', caretLine > 0 && +g.dataset.line === caretLine)); }
ta.addEventListener('scroll', syncScroll);
['keyup','click','focus','blur','select'].forEach(ev => ta.addEventListener(ev, () => requestAnimationFrame(caretMoved)));

/* ---------- mise en page du circuit ---------- */
const GEO = {gap:66, gh:40, gw:40, cg:18, top:48, bottom:36};
const F_LABEL = '600 15px "Space Grotesk", ui-sans-serif, system-ui, sans-serif', F_PARAM = '500 10.5px "JetBrains Mono", ui-monospace, monospace',
      F_CAP = '500 9px "JetBrains Mono", ui-monospace, monospace', F_WIRE = '500 11px "JetBrains Mono", ui-monospace, monospace';
const mctx = document.createElement('canvas').getContext('2d');
const tw = (txt, font) => { mctx.font = font; return mctx.measureText(txt).width; };
function widthOf(op){
  if (op.shape === 'barrier') return 8;
  if (op.shape === 'oplus' || op.shape === 'dot' || op.shape === 'swap') return 34;
  if (op.shape === 'meter') return Math.max(GEO.gw, ...Object.values(op.caps || {x: op.caption || ''}).map(c => tw(c, F_CAP) + 12));
  const pw = op.params.length ? tw(op.params.join(', '), F_PARAM) + 16 : 0;
  return Math.ceil(Math.max(GEO.gw, tw(op.label, F_LABEL) + 20, pw));
}
function layout(c){
  const n = c.wires.length, idx = new Map(c.wires.map((w, i) => [w.key, i]));
  const front = new Array(n).fill(0), colW = [], items = [];
  const sync = () => { const m = n ? Math.max(...front) : 0; front.fill(m); return m; };
  const place = op => {
    const ws = [...op.controls, ...op.targets].map(k => idx.get(k)), lo = Math.min(...ws), hi = Math.max(...ws);
    let col = 0; for (let i = lo; i <= hi; i++) col = Math.max(col, front[i]);
    for (let i = lo; i <= hi; i++) front[i] = col + 1;
    const w = widthOf(op); colW[col] = Math.max(colW[col] || 0, w);
    items.push({op, col, lo, hi, w, ci: op.controls.map(k => idx.get(k)), ti: op.targets.map(k => idx.get(k))});
  };
  let cur = null;
  for (const op of c.ops){ const g = op.group ? op.group.id : null; if (g !== cur){ sync(); cur = g; } place(op); }
  const depth = sync();
  c.meas.forEach(place);
  const x0 = Math.ceil(Math.max(70, Math.max(0, ...c.wires.map(w => tw(w.label, F_WIRE))) + 56));
  const colX = [], colL = []; let x = x0 + 20;
  colW.forEach((w, i) => { colL[i] = x; colX[i] = x + w / 2; x += w + GEO.cg; });
  const x1 = colW.length ? x - GEO.cg + 26 : x0 + 150;
  const y = i => GEO.top + i * GEO.gap;
  const measX = new Array(n).fill(null);
  for (const it of items) if (it.op.terminal && it.op.shape === 'meter') for (const i of it.ti) if (measX[i] === null) measX[i] = colX[it.col];
  const groups = new Map();
  for (const it of items){ const g = it.op.group; if (!g) continue; const r = groups.get(g.id) || {name: g.name, c0: it.col, c1: it.col, lo: it.lo, hi: it.hi};
    r.c0 = Math.min(r.c0, it.col); r.c1 = Math.max(r.c1, it.col); r.lo = Math.min(r.lo, it.lo); r.hi = Math.max(r.hi, it.hi); groups.set(g.id, r); }
  return {n, items, colX, colL, colW, x0, x1, y, measX, groups: [...groups.values()], depth,
    width: x1 + 14, height: GEO.top + Math.max(0, n - 1) * GEO.gap + GEO.bottom};
}

/* ---------- dessin ---------- */
let prevKeys = new Set(), prevWires = new Set(), current = [], selected = 0, lastSig = null, lastLayout = null;
function drawItem(it, L, i, keys){
  const op = it.op, cx = L.colX[it.col], y = L.y, H = GEO.gh, parts = [];
  const all = [...it.ci, ...it.ti], lo = Math.min(...all), hi = Math.max(...all);
  const key = [op.name, op.label, op.params.join(), op.controls.join(), op.targets.join(), it.col].join('|'); keys.add(key);
  const enter = !prevKeys.has(key);
  const yTop = y(lo) - H / 2 - 4, hh = y(hi) - y(lo) + H + 8;
  parts.push(`<rect class="hit" x="${cx - it.w / 2 - 4}" y="${yTop}" width="${it.w + 8}" height="${hh}"/>`);
  const line = (a, b) => `<line class="ln" x1="${cx}" y1="${a}" x2="${cx}" y2="${b}"/>`;
  const dots = () => it.ci.map((w, k) => `<circle class="${op.cvals[k] === 0 ? 'odot' : 'dot'}" cx="${cx}" cy="${y(w)}" r="${op.cvals[k] === 0 ? 4.6 : 4.3}"/>`).join('');
  const box = (x, yy, w, h) => `<rect class="b" x="${x}" y="${yy}" width="${w}" height="${h}" rx="9"/><rect class="tint" x="${x}" y="${yy}" width="${w}" height="${h}" rx="9"/>`;
  if (op.shape === 'barrier'){
    parts.push(line(y(lo) - H / 2 - 6, y(hi) + H / 2 + 6));
  } else if (op.shape === 'oplus'){
    const t = y(it.ti[0]); parts.push(line(y(lo), y(hi)), dots(), `<circle class="b" cx="${cx}" cy="${t}" r="11.5"/><circle class="tint" cx="${cx}" cy="${t}" r="11.5"/>`,
      `<path class="ln" d="M${cx - 11.5} ${t}H${cx + 11.5}M${cx} ${t - 11.5}V${t + 11.5}"/>`);
  } else if (op.shape === 'dot'){
    parts.push(line(y(lo), y(hi)), dots(), it.ti.map(w => `<circle class="dot" cx="${cx}" cy="${y(w)}" r="4.3"/>`).join(''));
  } else if (op.shape === 'swap'){
    parts.push(line(y(lo), y(hi)), dots(), it.ti.map(w => `<path class="ln" d="M${cx - 6} ${y(w) - 6}l12 12M${cx + 6} ${y(w) - 6}l-12 12"/>`).join(''));
  } else if (op.shape === 'meter'){
    if (op.joint) parts.push(line(y(lo), y(hi)));
    for (const w of it.ti){
      const wy = y(w), cap = op.caps ? op.caps[op.targets[it.ti.indexOf(w)]] : op.caption;
      parts.push(box(cx - it.w / 2, wy - H / 2, it.w, H),
        `<path class="ln" d="M${cx - 8.5} ${wy - 1}a8.5 8.5 0 0 1 17 0M${cx} ${wy - 1}l5.5 -8"/>`,
        `<text class="cap" x="${cx}" y="${wy + 11}">${esc(cap)}</text>`);
    }
  } else {
    const tlo = Math.min(...it.ti), thi = Math.max(...it.ti), by = y(tlo) - H / 2, bh = y(thi) - y(tlo) + H, cy = by + bh / 2;
    if (it.ci.length) parts.push(line(y(lo), y(hi)), dots());
    parts.push(box(cx - it.w / 2, by, it.w, bh));
    if (op.params.length) parts.push(`<text class="lbl" x="${cx}" y="${cy - 6.5}">${esc(op.label)}</text><text class="prm" x="${cx}" y="${cy + 9.5}">${esc(op.params.join(', '))}</text>`);
    else parts.push(`<text class="lbl" x="${cx}" y="${cy + 0.5}">${esc(op.label)}</text>`);
  }
  const cls = ['gate', 'fam-' + op.fam, op.shape === 'barrier' ? 'bar' : '', op.cond ? 'cond' : '', enter ? 'enter' : ''].join(' ');
  return `<g class="${cls}" data-i="${i}" data-line="${op.line || 0}" tabindex="0" style="--d:${Math.min(it.col, 16) * 55}ms">${parts.join('')}</g>`;
}
function draw(c){
  const L = lastLayout = layout(c), keys = new Set(), wkeys = new Set(), s = [];
  s.push(`<defs><linearGradient id="comet" x1="0" x2="1"><stop offset="0" stop-color="#86d6ff" stop-opacity="0"/><stop offset="1" stop-color="#e3f4ff" stop-opacity="1"/></linearGradient></defs>`);
  for (const g of L.groups){
    const x = L.colL[g.c0] - 8, w = L.colL[g.c1] + L.colW[g.c1] + 8 - x, yy = L.y(g.lo) - GEO.gh / 2 - 9, h = L.y(g.hi) - L.y(g.lo) + GEO.gh + 18;
    s.push(`<g class="grp"><rect x="${x}" y="${yy}" width="${w}" height="${h}" rx="12"/><text x="${x + 4}" y="${yy - 6}">${esc(g.name)}</text></g>`);
  }
  c.wires.forEach((w, i) => {
    const wy = L.y(i), xs = L.x0, mx = L.measX[i], xe = mx === null ? L.x1 : mx; wkeys.add(w.key);
    s.push(`<g class="wire${prevWires.has(w.key) ? '' : ' enter'}"><text class="w-name" x="${L.x0 - 38}" y="${wy}" text-anchor="end" dominant-baseline="central">${esc(w.label)}</text>`,
      `<text class="w-ket" x="${L.x0 - 8}" y="${wy + 0.5}" text-anchor="end" dominant-baseline="central">|0⟩</text>`,
      `<line class="w-q" pathLength="1" x1="${xs}" y1="${wy}" x2="${xe}" y2="${wy}"/>`);
    if (mx !== null) s.push(`<path class="w-c" d="M${mx} ${wy - 1.6}H${L.x1}M${mx} ${wy + 1.6}H${L.x1}"/>`);
    s.push(`</g>`);
    const span = xe - xs;
    if (span > 60) s.push(`<rect class="comet" x="-30" y="${wy - 0.8}" width="30" height="1.6" rx=".8" fill="url(#comet)" style="--a:${xs}px;--b:${xe + 4}px;--t:${(5.5 + span / 90).toFixed(2)}s;--dl:${(0.9 + i * 0.85).toFixed(2)}s"/>`);
  });
  L.items.forEach((it, i) => s.push(drawItem(it, L, i, keys)));
  prevKeys = keys; prevWires = wkeys;
  return {svg: s.join(''), L};
}
function fit(){
  const view = $('view'), svg = view.querySelector('svg'); if (!svg || !lastLayout) return;
  const aw = view.clientWidth - 36, ah = view.clientHeight - 36;
  const k = Math.max(0.6, Math.min(1.75, aw / lastLayout.width, ah / lastLayout.height));
  svg.setAttribute('width', Math.round(lastLayout.width * k)); svg.setAttribute('height', Math.round(lastLayout.height * k));
}
const plural = (n, w) => `<b>${n}</b> ${w}${n > 1 ? 's' : ''}`;
function render(force){
  const view = $('view'), chips = $('chips'), stats = $('stats');
  if (selected >= current.length) selected = Math.max(0, current.length - 1);
  const c = current[selected];
  chips.innerHTML = current.length ? current.map((x, i) => `<button class="chip" type="button" aria-pressed="${i === selected}" data-i="${i}">${esc(x.label)}</button>`).join('') : '<span>circuit</span>';
  if (!c || !c.wires.length){
    view.innerHTML = `<div class="empty">Aucun qubit pour l'instant.<br>Ajoute une porte, par exemple qml.Hadamard(wires=0)</div>`;
    stats.innerHTML = '<span>en attente d\'un circuit</span>'; lastSig = null; lastLayout = null; prevKeys = new Set(); prevWires = new Set(); return;
  }
  if (!force && c.sig === lastSig) return;
  lastSig = c.sig;
  const {svg, L} = draw(c);
  view.innerHTML = `<svg viewBox="0 0 ${L.width} ${L.height}" role="img" aria-label="Circuit ${esc(c.label)}">${svg}</svg>`;
  fit(); litGates();
  const gates = c.ops.filter(o => o.shape !== 'barrier' && o.name !== 'measure').length;
  stats.innerHTML = [plural(c.wires.length, 'qubit'), plural(gates, 'porte'), `profondeur <b>${L.depth}</b>`, c.shots ? plural(c.shots, 'shot') : null].filter(Boolean).map(x => `<span>${x}</span>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; selected = +b.dataset.i; prevKeys = new Set(); prevWires = new Set(); render(true); });

/* ---------- infobulle + lien avec le code ---------- */
const tip = $('tip');
function showTip(g){
  const it = lastLayout && lastLayout.items[+g.dataset.i]; if (!it) return;
  const op = it.op, info = INFO[op.name] || {t: op.terminal ? op.name : op.name, d: op.terminal ? '' : 'Opération PennyLane affichée telle quelle.'};
  const ws = op.all ? '' : (op.wires.length === 1 ? `wires=${op.wires[0]}` : `wires=[${op.wires.join(', ')}]`);
  const sig = op.terminal ? `qml.${op.name}(${op.obs ? 'qml.' + op.obs.replace(/⊗/g, ' @ ') : ws})` : `qml.${op.name}(${[...op.params, ws].filter(Boolean).join(', ')})`;
  let title = info.t; if (op.extra) title += ' · contrôlée'; if (/†$/.test(op.label)) title += ' · adjointe'; if (op.cond) title += ' · conditionnelle';
  let h = `<h2>${esc(title)}</h2><code>${esc(sig)}</code>${info.d ? `<p>${esc(info.d)}</p>` : ''}`;
  if (info.m && !op.extra && !/†$/.test(op.label)) h += `<div class="mx">${info.pre ? `<span class="pre">${esc(info.pre)}</span>` : ''}<div class="g" style="grid-template-columns:repeat(${info.m.length},auto)">${info.m.flat().map(x => `<span>${esc(x)}</span>`).join('')}</div></div>`;
  tip.innerHTML = h;
  const r = g.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2, y = r.top - tr.height - 10;
  if (y < 8) y = r.bottom + 10;
  x = Math.max(8, Math.min(x, innerWidth - tr.width - 8));
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('show');
  setBar(lhHover, +g.dataset.line);
}
function hideTip(){ tip.classList.remove('show'); setBar(lhHover, 0); }
const view = $('view');
view.addEventListener('pointerover', e => { const g = e.target.closest('.gate'); if (g) showTip(g); });
view.addEventListener('pointerout', e => { const g = e.target.closest('.gate'); if (g && !g.contains(e.relatedTarget)) hideTip(); });
view.addEventListener('focusin', e => { const g = e.target.closest('.gate'); if (g) showTip(g); });
view.addEventListener('focusout', hideTip);
view.addEventListener('scroll', hideTip);

/* ---------- boucle : code -> circuit ---------- */
let errTimer = 0;
function setError(err){
  const foot = $('foot'), pill = $('pill');
  if (err){
    errLine = err.line; foot.classList.add('bad'); pill.classList.add('bad');
    $('footTxt').textContent = (err.line ? `Ligne ${err.line} · ` : '') + err.message; $('pillTxt').textContent = 'code à corriger';
    view.classList.add('stale'); setBar(lhErr, err.line);
  } else {
    errLine = 0; foot.classList.remove('bad'); pill.classList.remove('bad');
    $('footTxt').textContent = 'Python · PennyLane'; $('pillTxt').textContent = 'PennyLane · en direct';
    view.classList.remove('stale'); setBar(lhErr, 0);
  }
  markGutter();
}
function update(){
  const res = QEngine.run(ta.value);
  clearTimeout(errTimer);
  if (res.error){ errTimer = setTimeout(() => setError(res.error), 650); return; }
  setError(null); current = res.circuits; render(false);
}
let runTimer = 0;
ta.addEventListener('input', () => {
  paintEditor(); syncScroll(); caretMoved();
  clearTimeout(runTimer); runTimer = setTimeout(update, 110);
  try { localStorage.setItem('hello-quantum-code', ta.value); } catch (e){}
});
let saved = null; try { saved = localStorage.getItem('hello-quantum-code'); } catch (e){}
ta.value = saved && saved.trim() ? saved : DEFAULT;
paintEditor(); update();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current.length) render(true); });
new ResizeObserver(fit).observe(view);

/* ---------- ciel ---------- */
(() => {
  const cv = $('sky'), ctx = cv.getContext('2d'); let W = 0, H = 0, dpr = 1, stars = [], meteor = null, nextMeteor = 9000, last = 0;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
    const n = Math.min(420, Math.round(W * H / 4600));
    stars = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.pow(Math.random(), 3) * 1.15 + 0.25, a: Math.random() * 0.5 + 0.12, p: Math.random() * 6.283, s: Math.random() * 0.7 + 0.2, warm: Math.random() < 0.14}));
    paint(0);
  }
  function paint(t){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    for (const s of stars){
      ctx.globalAlpha = s.a * (reduceMotion ? 1 : 0.7 + 0.3 * Math.sin(t * 0.001 * s.s + s.p));
      ctx.fillStyle = s.warm ? '#ffe7c4' : '#cdd9ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (meteor){
      const k = (t - meteor.t0) / meteor.life;
      if (k >= 1) meteor = null;
      else { const x = meteor.x + meteor.dx * k, y = meteor.y + meteor.dy * k, tx = x - meteor.dx * 0.16, ty = y - meteor.dy * 0.16;
        const g = ctx.createLinearGradient(tx, ty, x, y); g.addColorStop(0, 'rgba(205,217,255,0)'); g.addColorStop(1, 'rgba(230,240,255,.8)');
        ctx.globalAlpha = Math.sin(Math.PI * k) * 0.8; ctx.strokeStyle = g; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
  }
  function frame(t){
    requestAnimationFrame(frame);
    if (document.hidden || t - last < 40) return;
    const dt = t - last; last = t;
    for (const s of stars){ s.x -= s.r * 0.0045 * dt * 0.06; if (s.x < -2) s.x = W + 2; }
    if (!meteor && t > nextMeteor){ meteor = {t0: t, life: 950, x: W * (0.25 + Math.random() * 0.7), y: H * Math.random() * 0.4, dx: -(160 + Math.random() * 160), dy: 70 + Math.random() * 70}; nextMeteor = t + 16000 + Math.random() * 22000; }
    paint(t);
  }
  addEventListener('resize', resize); resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
})();
</script>
